name: CI
on:
    push:
        branches: [master, dev]
    pull_request:
        branches: [master]

jobs:
    hello:
      runs-on: ubuntu-latest
      steps:
       - name: Hello World
         run: echo "Hello World GitHub Actions"
       - name: Shows Date
         run: date
    php-lint:
        runs-on: ubuntu-latest
        steps:
         - name: Checkout
           uses: actions/checkout@v3
         - name: PHP Lint
           run: find . -name "*.php" -exec php -1 {} \;